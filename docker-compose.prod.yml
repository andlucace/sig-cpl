services:
  db:
    image: postgres:16-alpine
    container_name: sigcpl_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigcpl_backend
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.http.routers.sigcpl-web.rule=Host(`sigcpl.dedev.cloud`)
      - traefik.http.routers.sigcpl-web.entrypoints=web,websecure
      - traefik.http.routers.sigcpl-web.tls=true
      - traefik.http.routers.sigcpl-web.tls.certresolver=mytlschallenge
      - traefik.http.services.sigcpl-web.loadbalancer.server.port=8000

networks:
  internal:
  n8n_default:
    external: true

volumes:
  pgdata:
  uploads:
