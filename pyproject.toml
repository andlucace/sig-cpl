[project]
name = "sig-cpl"
version = "0.1.0"
description = "Sistema Integrado de Gestão de Cadeia Produtiva Local (SIG-CPL) — referência Programa SP Produz"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
    "pyotp>=2.9",
    "qrcode[pil]>=7.4",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # linha longa — não vale a pena reformatar retroativamente
    # F821 dispara falso-positivo em toda relação `Mapped["NomeDoModelo"]`
    # do SQLAlchemy — a string é resolvida pelo mapper do SQLAlchemy em
    # tempo de execução, não pelo Python; ruff não conhece essa convenção.
    "F821",
    # str+Enum -> StrEnum (Python 3.11+) é modernização de estilo, não
    # correção — dezenas de enums usam o padrão antigo hoje; migrar é
    # refatoração própria, não algo pra fazer de passagem aqui.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)`/`Query(...)`/etc. em default de parâmetro é o próprio
# mecanismo de injeção de dependência do FastAPI, não o padrão de bug
# "mutável em default" que B008 normalmente pega — sem isso, toda rota
# do projeto dispara o aviso.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
]
