<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SIG-CPL{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script>
        (function () {
            var escuro = window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.setAttribute("data-bs-theme", escuro ? "dark" : "light");
        })();
    </script>
</head>
<body>
{% block body %}
    <header class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container-fluid">
            <a class="navbar-brand fw-semibold d-flex align-items-center gap-2" href="/">
                <i class="bi bi-diagram-3-fill text-primary"></i>
                SIG-CPL
            </a>
            <span class="navbar-text small text-body-secondary d-none d-md-inline">
                Cadeia Produtiva Local — Programa SP Produz
            </span>
            <nav class="ms-auto d-flex align-items-center gap-3">
                {% block nav %}{% endblock %}
            </nav>
        </div>
    </header>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="text-center text-body-secondary small py-4">
        Sistema Integrado de Gestão de Cadeia Produtiva Local — versão de desenvolvimento.
    </footer>
{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
