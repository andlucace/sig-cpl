<div class="list-group-item" id="objetivo-{{ objetivo.id }}">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
        <div>
            <a href="/painel/planejamento/objetivos/{{ objetivo.id }}" class="fw-semibold">
                <i class="bi bi-bullseye text-primary me-2"></i>{{ objetivo.descricao }}
            </a>
            <small class="text-body-secondary d-block ms-4">
                Prazo {{ objetivo.prazo.value }}
                {% if objetivo.orcamento_estimado %} — Orçamento estimado: R$ {{ "%.2f"|format(objetivo.orcamento_estimado) }}{% endif %}
                {% if objetivo.responsavel %} — Responsável: {{ objetivo.responsavel.nome }}{% endif %}
            </small>
        </div>
        <select class="form-select form-select-sm w-auto" name="status"
                hx-post="/painel/planejamento/objetivos/{{ objetivo.id }}/status"
                hx-trigger="change"
                hx-target="#objetivo-{{ objetivo.id }}"
                hx-swap="outerHTML">
            {% for opcao in status_opcoes %}
                <option value="{{ opcao.value }}" {% if opcao == objetivo.status %}selected{% endif %}>
                    {{ opcao.value.replace('_', ' ') }}
                </option>
            {% endfor %}
        </select>
    </div>
</div>
