{% extends "base.html" %}
{% block title %}SIG-CPL — Redefinir senha{% endblock %}
{% block nav %}
    <a href="/login" class="link-secondary text-decoration-none small">
        <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
    </a>
{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-key-fill text-primary fs-1"></i>
                        <h1 class="h4 mt-2 mb-0">Definir nova senha</h1>
                    </div>
                    {% if erro %}
                        <div class="alert alert-danger py-2 small" role="alert">{{ erro }}</div>
                    {% endif %}
                    <form method="post" action="/redefinir-senha/{{ token }}">
                        <div class="mb-3">
                            <label class="form-label" for="nova_senha">Nova senha</label>
                            <input type="password" class="form-control" id="nova_senha" name="nova_senha" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="confirmar_senha">Confirmar nova senha</label>
                            <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-check-lg me-1"></i>Redefinir senha
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
