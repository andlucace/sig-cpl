<div class="list-group-item" id="presenca-{{ presenca.id }}">
    <i class="bi {{ 'bi-check-circle-fill text-success' if presenca.presente else 'bi-x-circle-fill text-danger' }} me-2"></i>
    <strong>{{ presenca.pessoa.nome }}</strong>
    <span class="badge {{ 'text-bg-success' if presenca.presente else 'text-bg-danger' }}">
        {{ 'presente' if presenca.presente else 'ausente' }}
    </span>
    {% if presenca.justificativa_ausencia %}
        <small class="text-body-secondary d-block ms-4">{{ presenca.justificativa_ausencia }}</small>
    {% endif %}
</div>
