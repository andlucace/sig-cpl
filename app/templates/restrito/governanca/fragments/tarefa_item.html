<div class="list-group-item" id="tarefa-{{ tarefa.id }}">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
        <div>
            <i class="bi bi-list-task text-primary me-2"></i>
            <strong>{{ tarefa.titulo }}</strong>
            {% if tarefa.prazo %}
                <small class="text-body-secondary d-block ms-4">
                    <i class="bi bi-calendar3 me-1"></i>Prazo: {{ tarefa.prazo.strftime('%d/%m/%Y') }}
                </small>
            {% endif %}
            {% if tarefa.descricao %}
                <small class="text-body-secondary d-block ms-4">{{ tarefa.descricao }}</small>
            {% endif %}
        </div>
        <select class="form-select form-select-sm w-auto" name="status"
                hx-patch="/painel/governanca/tarefas/{{ tarefa.id }}/status"
                hx-trigger="change"
                hx-target="#tarefa-{{ tarefa.id }}"
                hx-swap="outerHTML">
            {% for opcao in status_opcoes %}
                <option value="{{ opcao.value }}" {% if opcao == tarefa.status %}selected{% endif %}>
                    {{ opcao.value.replace('_', ' ') }}
                </option>
            {% endfor %}
        </select>
    </div>
</div>
