<a href="/painel/governanca/reunioes/{{ reuniao.id }}"
   id="reuniao-{{ reuniao.id }}"
   class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
    <span>
        <i class="bi bi-calendar-event-fill text-primary me-2"></i>{{ reuniao.titulo }}
        <small class="text-body-secondary d-block ms-4">
            {{ reuniao.data_hora.strftime('%d/%m/%Y %H:%M') }}{% if reuniao.local %} — {{ reuniao.local }}{% endif %}
        </small>
    </span>
    <span class="badge
        {% if reuniao.status.value == 'realizada' %}text-bg-success
        {% elif reuniao.status.value == 'cancelada' %}text-bg-danger
        {% else %}text-bg-warning{% endif %}">{{ reuniao.status.value }}</span>
</a>
